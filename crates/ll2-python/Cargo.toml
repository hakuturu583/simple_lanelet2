[package]
name = "ll2-python"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "PyO3 bindings exposing ll2-core as the `lanelet2` Python package"

[lib]
name = "_lanelet2"
crate-type = ["cdylib"]

[dependencies]
ll2-core.workspace = true
pyo3 = { version = "0.29", features = ["abi3-py39", "multiple-pymethods"] }

[features]
extension-module = ["pyo3/extension-module"]
