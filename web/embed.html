<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lanelet2 viewer</title>
    <meta name="robots" content="noindex" />
    <style>
      /* No page chrome at all: this document is only ever somebody else's panel.
         `transparent` on the html/body lets `?background=transparent` reach all the
         way down, so the host's own panel colour shows through. */
      html,
      body {
        margin: 0;
        height: 100%;
        background: transparent;
        overflow: hidden;
      }
      #viewer {
        position: absolute;
        inset: 0;
      }
      #message {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 16px;
        text-align: center;
        color: #98a2b3;
        font: 13px/1.5 ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto,
          'Hiragino Sans', 'Noto Sans JP', sans-serif;
      }
      #message.error {
        color: #ff8f6b;
      }
      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <div id="viewer"></div>
    <div id="message">Waiting for a map…</div>
    <script type="module" src="./embed.js"></script>
  </body>
</html>
