# Accepted differences between the reference implementation and ours in
# LANELET2_BUG_COMPAT=1 mode.
#
# This file is NOT for upstream bugs -- those are repaired by default and listed in
# compat_matrix.toml, and bug-compat mode reproduces them exactly. What belongs here
# is only functionality we have deliberately declined to implement.
#
# Every entry needs a reason. `case` and `key` are fnmatch patterns. The runner fails
# if an entry stops firing, so the list cannot rot.

[[allow]]
case = "0000_import"
key = "bug_compat_attr"
reason = """\
Deliberate addition, not a divergence in behaviour: lanelet2.BUG_COMPAT reports \
whether upstream-bug-compatible mode is active. Upstream has no such attribute, so \
the reference emits null here."""

[[allow]]
case = "0700_routing"
key = "export_graph*"
reason = """\
exportGraphML and exportGraphViz are out of scope. Reproducing them means \
reproducing Boost's GraphML and GraphViz writers byte for byte, which buys \
nothing for map handling; they raise here instead of writing a file that would \
differ anyway."""

[[allow]]
case = "1150_aw_map"
key = "written_sha"
reason = """\
Oracle skew, measured rather than assumed. The written file is the same length and \
differs in exactly five nodes, each a last-digit latitude -- the 1 ulp reverse-\
projection class of difference. Our output is byte-identical to ROS Humble's own \
build of lanelet2 (sha 3757bd26c344b1ab) and our mapping_example round-trip is \
byte-identical to the PyPI wheel 1.2.3; it is the pinned RoboStack 1.2.2, which links \
a different GeographicLib, that stands apart. `written_bytes` is compared normally \
and does match, so the claim this case makes is still a byte-level one."""

[[allow]]
case = "1400_aw_utilities"
key = "arc_wide"
reason = """\
A floating-point edge that only appears when the requested arc length saturates to \
exactly the total. getPolygonFromArcLength scales the request by each bound's length, \
which upstream takes from boost::geometry::length; that does not agree bit for bit \
with the running sum of the same segment distances used by the scan immediately \
afterwards, so the scan's strict `>` lands on either side of the final segment \
depending on which sum produced the bound. Upstream's right bound is cut one point \
short and interpolates an end point; ours keeps the original last point. Measured on \
mapping_example.osm: 15 polygon points versus our 16, the extra one lying on the \
segment between two of theirs. Ordinary requests -- arc_0_5 and arc_2_9 in the same \
case -- agree exactly, and no reimplementation without boost can settle this one."""
