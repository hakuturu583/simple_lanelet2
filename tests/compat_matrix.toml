# Machine-readable index of every upstream defect we repair by default.
#
# Each entry names a case/key where COMPAT (LANELET2_BUG_COMPAT=1, reproducing
# upstream) and FIXED (default) are *expected* to disagree. The runner checks the
# table in both directions:
#
#   * a difference at a key that is NOT listed here fails -- an unintended
#     behaviour change slipped in;
#   * a listed key where COMPAT and FIXED agree also fails -- the repair is not
#     actually wired up, or the case no longer exercises it.
#
# `case` and `key` are fnmatch patterns. Keep `reason` in sync with
# docs/DIVERGENCE.md and the predicate names in crates/ll2-core/src/compat.rs.

[[entry]]
case = "0110_basic_point"
key = "truediv"
reason = """\
Upstream registers only __div__, which Python 3 never calls, so `p / 2` raises \
TypeError on every basic point type. We implement __truediv__; in bug-compat mode \
it returns NotImplemented so Python raises upstream's exact TypeError."""

# Upstream's __hash__ hashes the id alone while __eq__ compares storage identity,
# violating Python's hash/eq contract. We hash identity instead so the two agree.
# Only the assertions that actually exercise the contradiction belong here --
# `hash_matches_alias` compares two handles that share both id and storage, so it
# agrees in either mode.

[[entry]]
case = "0120_point"
key = "hash_matches_same_id"
reason = "id-only hashing makes two distinct points with the same id hash equal"

[[entry]]
case = "0130_linestring"
key = "hash_matches_inverse"
reason = "id-only hashing makes a linestring and its inverse hash equal despite comparing unequal"

[[entry]]
case = "0210_lanelet"
key = "hash_matches_inverse"
reason = "id-only hashing makes a lanelet and its inverse hash equal despite comparing unequal"

[[entry]]
case = "0220_regelem"
key = "limit_attributes"
reason = """\
Upstream binds SpeedLimit's constructor to TrafficSign::make, so a SpeedLimit is \
tagged subtype=traffic_sign instead of speed_limit -- which then round-trips \
through a written map as the wrong kind of element."""

[[entry]]
case = "0220_regelem"
key = "tswt_signs"
reason = """\
Upstream never registers a Python class for the vector behind \
TrafficSignsWithType.trafficSigns, so reading the property raises TypeError -- the \
property is unusable there. We return the list of signs."""

[[entry]]
case = "0230_area"
key = "const_repr"
reason = """\
Upstream's makeAreaRepr takes a display name and then ignores it, hardcoding \
"Area", so repr(ConstArea(...)) claims to be a mutable Area."""

[[entry]]
case = "0300_projection"
key = "origin_alt_kwarg"
reason = """\
Upstream registers Origin's keywords as (lat, lon, lon): the third is misnamed, so \
`lon=` fills the altitude as well and `alt=` is accepted and ignored. \
Origin(lat=49, lon=8.4, alt=100) ends up 8.4 metres up instead of 100."""

[[entry]]
case = "0300_projection"
key = "origin_lon_kwarg_only"
reason = "same misnamed keyword: Origin(lat=49, lon=8.4) gets an altitude of 8.4 m"

[[entry]]
case = "0221_regelem_kinds"
key = "ctor_limit_subtype"
reason = """\
The same SpeedLimit constructor bug as 0220_regelem/limit_attributes, seen through \
the subtype attribute alone."""

[[entry]]
case = "0221_regelem_kinds"
key = "ctor_limits"
reason = """\
A consequence of that bug rather than a separate one, and the reason the typed \
accessors need kinds rather than class names: upstream's SpeedLimit constructor \
yields an object that is a TrafficSign to a dynamic cast, so lanelet.speedLimits() \
cannot see it. Repairing the constructor makes it visible."""
