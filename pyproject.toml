[build-system]
requires = ["maturin>=1.9,<2.0"]
build-backend = "maturin"

[project]
name = "simple-lanelet2"
version = "1.0.2"
description = "A drop-in reimplementation of the Lanelet2 Python API, in Rust"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "BSD-3-Clause" }
keywords = ["lanelet2", "hd-map", "autonomous-driving", "autoware", "gis"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering :: GIS",
]

[project.urls]
Homepage = "https://github.com/hakuturu583/simple_lanelet2"
Repository = "https://github.com/hakuturu583/simple_lanelet2"
Issues = "https://github.com/hakuturu583/simple_lanelet2/issues"

[tool.maturin]
manifest-path = "crates/ll2-python/Cargo.toml"
module-name = "lanelet2._lanelet2"
python-source = "python"
# maturin only ships the package matching module-name, so the extension shim has to
# be named explicitly or it silently vanishes from the wheel -- which shows up much
# later as an ImportError in the one venv built from a wheel rather than in place.
python-packages = ["lanelet2", "autoware_lanelet2_extension_python"]
features = ["pyo3/extension-module"]
# The sdist is built from what cargo would package, and cargo packages a crate rather
# than the repository, so files at the root are not in it. The metadata declares
# License-File regardless, and PyPI rejects an upload whose metadata names a file the
# archive does not contain.
include = [
    { path = "LICENSE", format = "sdist" },
    { path = "NOTICE", format = "sdist" },
]
strip = true
