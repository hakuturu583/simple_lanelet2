[build-system]
requires = ["maturin>=1.9,<2.0"]
build-backend = "maturin"

[project]
name = "simple-lanelet2"
version = "0.1.0"
description = "A Rust reimplementation of the Lanelet2 Python API"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "BSD-3-Clause" }
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering :: GIS",
]

[tool.maturin]
manifest-path = "crates/ll2-python/Cargo.toml"
module-name = "lanelet2._lanelet2"
python-source = "python"
features = ["pyo3/extension-module"]
strip = true
